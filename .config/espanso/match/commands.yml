# Command line snippets

matches:
  - trigger: ";xxsetup"
    replace: "claude mcp add --scope user codex -- uvx codex-as-mcp@latest --yolo"
    label: "setup codex mcp"

  - trigger: ";fixc"
    replace: "Resolve the current git merge conflicts. For each conflicted file, inspect all three stages (git show :1:path :2:path :3:path) and check recent commits on both HEAD and MERGE_HEAD to understand intent. Apply clean edits with no conflict markers remaining, then recommend tests based on files touched."
    label: "fix merge conflicts prompt"

  - trigger: ";fc"
    replace: "fast commit"
    label: "fast commit"

  - trigger: ";ogns"
    replace: "ONE_GREP_NO_SPEC"
    label: "ONE_GREP_NO_SPEC"

  - trigger: ";spie"
    replace: "single-possibility-instant-essence"
    label: "single-possibility-instant-essence"
